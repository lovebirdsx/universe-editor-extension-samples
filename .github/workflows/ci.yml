name: CI

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [editor-release]
  workflow_dispatch:

jobs:
  check:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build:all

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 编辑器产物来自主仓库正式发布 Release（tag 形如 vX.Y.Z）。repository_dispatch
      # 由主仓库发布流程触发，client_payload.tag 携带具体 tag；push / PR / 手动触发时
      # tag 为空，回退到 releases/latest 的最新正式版本。
      # zip 内可执行文件为 linux-unpacked/universe-editor，UNIVERSE_EDITOR_BIN 指向该
      # 打包版可执行文件，harness 的 resolveEditorLaunchTarget 据此直接启动。
      - name: Download editor (release)
        env:
          EDITOR_TAG: ${{ github.event.client_payload.tag }}
        run: |
          tag="$EDITOR_TAG"
          if [ -n "$tag" ]; then
            url="https://github.com/lovebirdsx/universe-editor/releases/download/${tag}/universe-editor-linux-x64.zip"
          else
            url="https://github.com/lovebirdsx/universe-editor/releases/latest/download/universe-editor-linux-x64.zip"
          fi
          curl -fL --retry 3 -o /tmp/editor.zip "$url"
          unzip -q /tmp/editor.zip -d /tmp/editor
      # 保险步骤：ubuntu-latest 一般预装 xvfb 与 electron 所需系统库，但缺库时
      # electron 启动报 "error while loading shared libraries"，此处显式补齐。
      - name: Install xvfb + Electron system libs (insurance)
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgtk-3-0 libasound2t64
      - name: Run e2e
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run e2e
        env:
          UNIVERSE_EDITOR_BIN: /tmp/editor/linux-unpacked/universe-editor
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  e2e-windows:
    name: E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 编辑器产物来自主仓库正式发布 Release（tag 形如 vX.Y.Z）。repository_dispatch
      # 由主仓库发布流程触发，client_payload.tag 携带具体 tag；push / PR / 手动触发时
      # tag 为空，回退到 releases/latest 的最新正式版本。
      # Windows 版 zip 内可执行文件为 win-unpacked/Universe Editor.exe。curl.exe 与 7z 均
      # 为 windows runner 预装，7z 比 Expand-Archive 更快更可靠。
      - name: Download editor (release)
        env:
          EDITOR_TAG: ${{ github.event.client_payload.tag }}
        run: |
          $tag = "$env:EDITOR_TAG"
          if ($tag) {
            $url = "https://github.com/lovebirdsx/universe-editor/releases/download/$tag/universe-editor-win-x64.zip"
          } else {
            $url = "https://github.com/lovebirdsx/universe-editor/releases/latest/download/universe-editor-win-x64.zip"
          }
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\editor.zip" $url
          7z x "$env:RUNNER_TEMP\editor.zip" -o"$env:RUNNER_TEMP\editor"
      # Windows 无需 xvfb；UNIVERSE_EDITOR_BIN 指向打包版 exe，harness 据此直接启动。
      - name: Run e2e
        run: npm run e2e
        env:
          UNIVERSE_EDITOR_BIN: ${{ runner.temp }}\editor\win-unpacked\Universe Editor.exe
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-windows
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
